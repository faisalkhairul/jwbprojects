<!doctype HTML>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <form id="login-form">
        <div class="heading">
            <h1>Login</h1>
            <p>Please enter your username and password</p>
        </div>
        <div class="username">
            <input type="text" id="username" name="username" placeholder="Please input your username">
        </div>
        <div class="password">
            <input type="password" id="password" name="password" placeholder="Please input your password">
        </div>
            <button type="submit">Login</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
